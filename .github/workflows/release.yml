name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: Build - ${{ matrix.platform.os }}
    runs-on: ${{ matrix.platform.os }}
    strategy:
      matrix:
        platform:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            binary_name: portal-tech-cli-linux
          - os: macos-latest
            target: x86_64-apple-darwin
            binary_name: portal-tech-cli-macos
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            binary_name: portal-tech-cli-win.exe

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform.target }}

      - name: Build CLI
        run: cargo build -p cli --release --target ${{ matrix.platform.target }}

      - name: Rename Binary
        shell: bash
        run: |
          if [ "${{ matrix.platform.os }}" = "windows-latest" ]; then
            mv target/${{ matrix.platform.target }}/release/cli.exe ${{ matrix.platform.binary_name }}
          else
            mv target/${{ matrix.platform.target }}/release/cli ${{ matrix.platform.binary_name }}
          fi

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.platform.binary_name }}
          path: ${{ matrix.platform.binary_name }}

  publish:
    name: Publish to NPM
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare NPM Package
        run: |
          mkdir -p npm/bin
          cp artifacts/binary-portal-tech-cli-linux/portal-tech-cli-linux npm/bin/
          cp artifacts/binary-portal-tech-cli-macos/portal-tech-cli-macos npm/bin/
          cp artifacts/binary-portal-tech-cli-win.exe/portal-tech-cli-win.exe npm/bin/
          chmod +x npm/bin/portal-tech-cli-linux
          chmod +x npm/bin/portal-tech-cli-macos

      - name: Publish to NPM
        run: |
          cd npm
          npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
