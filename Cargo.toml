[workspace]
members = [
    "crates/cli",
    "crates/server",
    "crates/shared",
]
resolver = "2"

[workspace.dependencies]
tokio = { version = "1.37.0", features = ["full"] }
serde = { version = "1.0.197", features = ["derive"] }
serde_json = "1.0.114"
tokio-tungstenite = "0.21.0"
anyhow = "1.0.81"
log = "0.4.21"
env_logger = "0.11.3"
futures-util = "0.3.30"
nanoid = "0.4.0"
